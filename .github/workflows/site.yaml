# Builds the Hugo site and deploys it through the GitHub Pages workflow path.
# The deploy job only succeeds once the repository's Pages build_type is
# flipped from "legacy" to "workflow" (managed in the infra repo); until then
# it fails harmlessly while Pages keeps serving the branch root.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Plain (non-extended) binary on purpose: the site must not depend on
  # extended-only features such as embedded Sass.
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Hugo
      run: |
        curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Build
      run: hugo

    # go get resolution must never silently regress: every registry entry must
    # render its exact go-import and go-source metas (ADR 0016).
    - name: Verify vanity metas
      run: |
        set -euo pipefail
        count="$(yq '.modules | length' data/vanity.yaml)"
        [ "$count" -gt 0 ]
        for i in $(seq 0 $((count - 1))); do
          module="$(yq ".modules[$i].module" data/vanity.yaml)"
          repo="$(yq ".modules[$i].repo" data/vanity.yaml)"
          page="public/${module#valiss.dev/}/index.html"
          grep -F "<meta name=\"go-import\" content=\"$module git $repo\">" "$page"
          grep -F "<meta name=\"go-source\" content=\"$module $repo $repo/tree/main{/dir} $repo/blob/main{/dir}/{file}#L{line}\">" "$page"
        done

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
