# Registry of Go module roots served under valiss.dev (ADR 0016).
# Every module root gets exactly one explicit vanity page, generated by
# content/_content.gotmpl; subpackages ride the toolchain's 404 walk-up.
# A module root's entry is added together with its repository, never before.
modules:
  - module: valiss.dev/valiss
    repo: https://github.com/valiss-dev/valiss-go
  - module: valiss.dev/cli/valiss
    repo: https://github.com/valiss-dev/valiss-cli
